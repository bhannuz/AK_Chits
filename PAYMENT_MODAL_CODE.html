<!-- ══ RECORD PAYMENT MODAL ════════════════════════════════════════════════════ -->
<div id="paymentModal" class="modal-overlay">
    <div class="modal-content-custom">
        <!-- Header -->
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <div style="font-size:1rem;font-weight:800;color:#f39c12;flex:1;">💳 Record Payment</div>
            <button onclick="resetPaymentForm()" title="Clear" style="background:rgba(243,156,18,.12);border:1px solid rgba(243,156,18,.3);color:#f39c12;border-radius:8px;padding:6px 10px;font-size:0.8rem;font-weight:700;cursor:pointer;">🔄</button>
            <button onclick="closeModal('paymentModal')" style="background:none;border:none;color:var(--text-dim);font-size:1.2rem;cursor:pointer;padding:2px 6px;">✕</button>
        </div>

        <!-- STEP 1: Select Member & Group -->
        <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:12px;margin-bottom:16px;">
            <div style="font-size:0.85rem;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Step 1: Select member & group</div>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
                <div>
                    <label class="form-label-small">Date</label>
                    <input type="date" id="pDate" class="form-input" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;">
                </div>
                <div>
                    <label class="form-label-small">Member</label>
                    <div style="position:relative;">
                        <input type="text" id="pMemberSearch" class="form-input" placeholder="🔍 Search…" oninput="filterSearch('pMemberSearch','pMemberList','pMember')" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;">
                        <input type="hidden" id="pMember">
                        <div id="pMemberList" class="suggestions-list"></div>
                    </div>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div>
                    <label class="form-label-small">Group / Slot</label>
                    <select id="pGroup" class="form-input" onchange="onGroupChange()" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;"><option value="">-- Member first --</option></select>
                    <input type="hidden" id="pEnrollmentId">
                    <input type="hidden" id="pSlotNum" value="1">
                </div>
                <div>
                    <label class="form-label-small">Chit Amount</label>
                    <input type="text" id="pChitDisplay" class="form-input" placeholder="Auto-filled" disabled style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;background:rgba(255,255,255,0.05);color:var(--text-dim);">
                </div>
            </div>
        </div>

        <div id="jointMemberBanner" style="display:none;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.28);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:0.8rem;"></div>

        <!-- STEP 2: Add Payments -->
        <div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:12px;margin-bottom:16px;">
            <div style="font-size:0.85rem;font-weight:700;color:#10b981;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Step 2: Add payments (one at a time)</div>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
                <div>
                    <label class="form-label-small">📅 Month</label>
                    <select id="pMonth" class="form-input" onchange="onMonthSelected()" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;">
                        <option value="">-- Select month --</option>
                    </select>
                </div>
                <div>
                    <label class="form-label-small">Amount</label>
                    <input type="number" id="pPaid" class="form-input" placeholder="₹ 0.00" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;">
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
                <div>
                    <label class="form-label-small">Paid By (Mode)</label>
                    <div style="display:flex;gap:4px;">
                        <select id="pPaidBy" class="form-input" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;flex:1;">
                            <option value="">-- Select --</option>
                        </select>
                        <button type="button" onclick="openManagePaidBy('pPaidBy')" style="background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.35);color:#a5b4fc;border-radius:7px;padding:7px 8px;font-size:0.8rem;cursor:pointer;flex-shrink:0;">⚙️</button>
                    </div>
                    <div id="pPaidByDrop" style="display:none;"></div>
                </div>
                <div>
                    <label class="form-label-small">Payment Date</label>
                    <input type="date" id="pPaymentDate" class="form-input" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;">
                </div>
            </div>

            <!-- Month info badge -->
            <div id="monthInfoBadge" style="display:none;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:0.82rem;color:#a5b4fc;"></div>

            <!-- Add Payment Button -->
            <button type="button" onclick="addPaymentEntry()" style="width:100%;padding:10px;background:#10b981;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.9rem;margin-top:8px;">+ Add this payment</button>
        </div>

        <!-- Payment Entries List -->
        <div id="paymentEntriesSection" style="display:none;margin-bottom:16px;">
            <div style="font-size:0.85rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Payment entries added</div>
            <div id="paymentEntriesList" style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;"></div>
        </div>

        <!-- Summary Box -->
        <div id="paymentSummaryBox" style="display:none;background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.3);border-radius:12px;padding:12px;margin-bottom:16px;">
            <div style="font-size:0.85rem;font-weight:700;color:#fbbf24;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Summary</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid rgba(251,191,36,0.2);">
                <span style="color:var(--text-dim);">Total being recorded</span>
                <span id="summaryTotal" style="font-size:1.1rem;font-weight:700;color:#fbbf24;">₹0</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.92rem;">
                <span style="color:var(--text-dim);">Payment entries</span>
                <span id="summaryCount" style="font-weight:600;color:#fbbf24;">0</span>
            </div>
        </div>

        <!-- Chit Picked Option -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
            <div>
                <label class="form-label-small">Chit Picked?</label>
                <select id="pChitPicked" class="form-input" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;" onchange="toggleChitPickedName()">
                    <option value="No">No</option>
                    <option value="Yes">Yes ✅</option>
                </select>
            </div>
            <div id="chitPickedNameDiv" style="display:none;">
                <label class="form-label-small">Picked Value</label>
                <input type="text" id="pChitPickedBy" class="form-input" placeholder="Value / Winner" style="margin-bottom:0;font-size:0.8rem;padding:7px 9px;">
            </div>
        </div>

        <!-- Hidden fields for compatibility -->
        <input type="hidden" id="pChit">
        <select id="pPaymentNote" style="display:none;"><option value="">-- None --</option><option value="Advance">Advance</option><option value="Partial">Partial</option><option value="Late Fee">Late Fee</option><option value="Custom">Custom…</option></select>
        <input type="text" id="pCustomNote" style="display:none;">

        <!-- Action buttons -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="btn-save" onclick="savePayment()" style="margin-bottom:0;">✓ Save all payments</button>
            <button class="btn-cancel" onclick="closeModal('paymentModal')" style="margin-bottom:0;">Cancel</button>
        </div>
    </div>
</div>
