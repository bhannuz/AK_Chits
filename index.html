<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Chit Funds</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <!-- APP HEADER -->
    <div class="app-header">
        <div class="brand-wrap">
            <div class="brand-logo"><img src="img/logo.png" alt="Logo" style="width:40px;height:40px;"></div>
            <div>
                <div class="brand-name">AK Chit Funds <span class="brand-cloud">☁ CLOUD</span></div>
                <div class="brand-sub">Chit Fund Management</div>
            </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <span id="headerRoleBadge" style="background:rgba(243,156,18,0.15);color:#f39c12;padding:4px 12px;border-radius:6px;font-size:0.8rem;font-weight:800;"></span>
            <button id="logoutBtn" onclick="logout()" style="background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.85rem;">🚪 Logout</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">
        <!-- HOME TAB -->
        <div id="homeTab" class="tab-content active">
            <div id="adminHomeContent"></div>
            <div id="memberHomeContent"></div>
        </div>

        <!-- PLANNER TAB -->
        <div id="plannerTab" class="tab-content">
            <div id="plannerData"></div>
        </div>

        <!-- GROUPS TAB -->
        <div id="groupsTab" class="tab-content">
            <div style="display:flex;gap:8px;margin-bottom:16px;">
                <button id="grpSubGroups" onclick="switchGroupsSubTab('groups')" style="flex:1;padding:8px;border:none;border-radius:9px;font-size:0.8rem;font-weight:800;cursor:pointer;transition:all .2s;">📂 Groups</button>
                <button id="grpSubCollections" onclick="switchGroupsSubTab('collections')" style="flex:1;padding:8px;border:none;border-radius:9px;font-size:0.8rem;font-weight:800;cursor:pointer;transition:all .2s;">📅 Monthly Collection</button>
            </div>
            <div id="groupListArea"></div>
            <div id="collectionsArea"></div>
        </div>

        <!-- BACKUP TAB -->
        <div id="backupTab" class="tab-content">
            <div id="backupContent"></div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="groupModal" class="modal-overlay">
        <div class="modal-content-custom">
            <div class="modal-title" id="groupModalTitle">🏦 New Group</div>
            <div class="form-label-small">Group Name</div>
            <input type="text" id="gName" class="form-input" placeholder="e.g., Gold Group">
            <div class="form-label-small">Duration (months)</div>
            <input type="number" id="gDuration" class="form-input" placeholder="e.g., 21">
            <div class="form-label-small">Due Day (1-31)</div>
            <input type="number" id="gDueDay" class="form-input" min="1" max="31" placeholder="e.g., 5">
            <div class="form-label-small">Start Date</div>
            <input type="date" id="gStart" class="form-input">
            <div style="margin:12px 0;">
                <label style="color:#a5b4fc;font-weight:700;"><input type="radio" name="gAmtType" value="fixed" id="gAmtFixed" onchange="toggleGroupAmtType()" checked> Fixed Amount</label>
                <label style="color:#a5b4fc;font-weight:700;margin-left:16px;"><input type="radio" name="gAmtType" value="variable" id="gAmtVariable" onchange="toggleGroupAmtType()"> Variable</label>
            </div>
            <div id="gFixedAmtRow">
                <div class="form-label-small">Fixed Monthly Amount (₹)</div>
                <input type="number" id="gFixedAmt" class="form-input" placeholder="e.g., 23077">
            </div>
            <button onclick="saveGroup()" class="btn-save">💾 Save</button>
            <button onclick="closeModal('groupModal')" class="btn-cancel">Cancel</button>
            <div id="deleteGroupArea" style="display:none;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
                <button onclick="deleteGroupFromModal()" class="btn-danger-full">🗑️ Delete Group</button>
            </div>
        </div>
    </div>

    <!-- MEMBER MODAL -->
    <div id="memberModal" class="modal-overlay">
        <div class="modal-content-custom">
            <div class="modal-title" id="memberModalTitle">👤 New Member</div>
            <div class="form-label-small">Name</div>
            <input type="text" id="mName" class="form-input" placeholder="Full name">
            <div class="form-label-small">Phone (optional)</div>
            <input type="tel" id="mPhone" class="form-input" placeholder="10-digit phone">
            <button onclick="saveMember()" class="btn-save">💾 Save</button>
            <button onclick="closeModal('memberModal')" class="btn-cancel">Cancel</button>
            <div id="deleteMemberArea" style="display:none;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
                <button onclick="deleteMemberFromModal()" class="btn-danger-full">🗑️ Delete Member</button>
            </div>
        </div>
    </div>

    <!-- PAYMENT MODAL -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal-content-custom">
            <div class="modal-title">💰 Payment</div>
            <div class="form-label-small">Group</div>
            <select id="pGroup" class="form-input"></select>
            <div class="form-label-small">Member</div>
            <select id="pMember" class="form-input"></select>
            <div class="form-label-small">Amount (₹)</div>
            <input type="number" id="pAmount" class="form-input" placeholder="0">
            <div class="form-label-small">Date</div>
            <input type="date" id="pDate" class="form-input">
            <div class="form-label-small">Paid By</div>
            <input type="text" id="pMode" class="form-input" placeholder="e.g., Bank Transfer">
            <button onclick="savePayment()" class="btn-save">✅ Save</button>
            <button onclick="closeModal('paymentModal')" class="btn-cancel">Cancel</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="nav-bar">
        <div class="nav-item active" id="navHome" onclick="switchTab('home')">🏠<br>Home</div>
        <div class="nav-item" id="navPlanner" onclick="switchTab('planner')">📋<br>Planner</div>
        <div class="nav-item" id="navGroups" onclick="switchTab('groups')">📁<br>Groups</div>
        <div class="nav-item" id="navBackup" onclick="switchTab('backup')">💾<br>Backup</div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/firebase-app.js"></script>
    <script src="js/firebase-firestore.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/ledger.js"></script>
    <script src="js/members.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/backup.js"></script>
</body>
</html>
